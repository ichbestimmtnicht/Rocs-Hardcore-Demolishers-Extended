rocs-hardcore-vulcanus-nerf-coal-liquefaction-recipes=-50% ผลิตภัณฑ์และ +50% ประดิษฐ์เวลาสําหรับการละลายถ่านหิน และ การละลายถ่านหินแบบง่ายๆ.
